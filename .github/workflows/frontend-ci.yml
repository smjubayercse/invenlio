name: Frontend CI
on:
  push:
    paths: ["web/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/frontend-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Format, lint, typecheck, unit test and build
        working-directory: web
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
