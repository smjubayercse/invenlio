name: Backend CI
on:
  push:
    paths: ["backend/**", "pom.xml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "pom.xml", ".github/workflows/backend-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

